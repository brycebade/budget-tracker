<!DOCTYPE html>
<html lang="en" data-theme="charcoal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Financial Planner | Dashboard</title>
</head>
<body class="min-h-screen bg-base-300">

    <header id="navbar"></header>
    <aside id="sidebar"></aside>
    
    <main class="min-h-screen pt-16 ml-64">
        <div class="p-8">
            <div class="mb-6">
                <h2 class="text-2xl font-bold">Dashboard</h2>
            </div>
                
            <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
                <div class="card bg-base-100 shadow">
                    <div class="card-body">
                        <p class="text-sm text-base-content/70">Net Worth</p>
                        <p id="netWorthValue" class="text-2xl font-bold">$0.00</p>
                    </div>
                </div>

                <div class="card bg-base-100 shadow">
                    <div class="card-body">
                        <p class="text-sm text-base-content/70">Available Cash</p>
                        <p id="availableCashValue" class="text-2xl font-bold">$0.00</p>
                    </div>
                </div>

                <div class="card bg-base-100 shadow">
                    <div class="card-body">
                        <p class="text-sm text-base-content/70">Total Debt</p>
                        <p id="totalDebtValue" class="text-2xl font-bold">$0.00</p>
                    </div>
                </div>

                <div class="card bg-base-100 shadow">
                    <div class="card-body">
                        <p class="text-sm text-base-content/70">Savings</p>
                        <p id="savingsValue" class="text-2xl font-bold">$0.00</p>
                    </div>
                </div>

                <div class="card bg-base-100 shadow">
                    <div class="card-body">
                        <p class="text-sm text-base-content/70">Investments</p>
                        <p id="investmentsValue" class="text-2xl font-bold">$0.00</p>
                    </div>
                </div>

                <div class="card bg-base-100 shadow">
                    <div class="card-body">
                        <p class="text-sm text-base-content/70">Retirement</p>
                        <p id="retirementValue" class="text-2xl font-bold">$0.00</p>
                    </div>
                </div>
            </div>

            <section class="mt-8">
                <div class="mb-4">
                    <h2 class="text-xl font-bold">Recent Transactions</h2>
                    <p class="mt-1 text-sm text-base-content/60">
                        Your latest account activity.
                    </p>
                </div>

                <div 
                    id="recentTransactionsContainer"
                    class="overflow-hidden rounded-box border-base-300 bg-base-100"
                >
                    <div class="p-4 text-base-content/60">
                        No Recent transactions to display.
                    </div>
                </div>
            </section>
        </div>
    </main>
  
    <script type="module" src="./dashboard.js"></script>
</body>
</html>
