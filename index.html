<!DOCTYPE html>
<html lang="en" data-theme="charcoal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Financial Planner | Dashboard</title>
</head>
<body class="min-h-screen bg-base-300">

    <header id="navbar"></header>
    <aside id="sidebar"></aside>
    
    <main class="min-h-screen pt-16 lg:ml-64">
        <div class="p-8">
            <div class="mb-6">
                <h1 class="text-3xl font-bold tracking-tight">Good Morning</h1>
                <p class="mt-2 text-sm text-base-content/60">Here's Your Financial Position</p>

                <div class="mt-5 flex gap-2 overflow-x-auto pb-2">
                    <button class="btn btn-sm btn-ghost">Today</button>
                    <button class="btn btn-sm btn-ghost">Payday</button>
                    <button class="btn btn-sm btn-ghost">Month</button>
                    <button class="btn btn-sm btn-ghost">90 Days</button>
                    <button class="btn btn-sm btn-ghost">Year</button>
                    <button class="btn btn-sm btn-ghost">Long Term</button>
                </div>
            </div>
                
            <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
                <div class="card bg-base-100 shadow">
                    <div class="card-body">
                        <p class="text-sm text-base-content/70">Net Worth</p>
                        <p id="netWorthValue" class="text-2xl font-bold">$0.00</p>
                    </div>
                </div>

                <div class="card bg-base-100 shadow">
                    <div class="card-body">
                        <p class="text-sm text-base-content/70">Available Cash</p>
                        <p id="availableCashValue" class="text-2xl font-bold">$0.00</p>
                    </div>
                </div>

                <div class="card bg-base-100 shadow">
                    <div class="card-body">
                        <p class="text-sm text-base-content/70">Total Debt</p>
                        <p id="totalDebtValue" class="text-2xl font-bold">$0.00</p>
                    </div>
                </div>

                <div class="card bg-base-100 shadow">
                    <div class="card-body">
                        <p class="text-sm text-base-content/70">Savings</p>
                        <p id="savingsValue" class="text-2xl font-bold">$0.00</p>
                    </div>
                </div>

                <div class="card bg-base-100 shadow">
                    <div class="card-body">
                        <p class="text-sm text-base-content/70">Investments</p>
                        <p id="investmentsValue" class="text-2xl font-bold">$0.00</p>
                    </div>
                </div>

                <div class="card bg-base-100 shadow">
                    <div class="card-body">
                        <p class="text-sm text-base-content/70">Retirement</p>
                        <p id="retirementValue" class="text-2xl font-bold">$0.00</p>
                    </div>
                </div>
            </div>

            <div id="test-chart" style="width: 100%; height: 300px;"></div>

            <section class="mt-8 w-full md:w-1/2">
                <div class="mb-3">
                    <h2 class="text-xl font-bold">Recent Transactions</h2>
                    <p class="mt-1 text-sm text-base-content/60">
                        Your latest account activity.
                    </p>
                </div>

                <div 
                    id="recentTransactionsContainer"
                    class="overflow-hidden rounded-box border border-base-300 bg-base-100"
                >
                    <div class="p-4 text-base-content/60">
                        No Recent transactions to display.
                    </div>
                </div>
            </section>
        </div>
    </main>
  
    <script src="./vendor/echarts.min.js"></script>
    <script type="module" src="./dashboard.js"></script>
</body>
</html>
